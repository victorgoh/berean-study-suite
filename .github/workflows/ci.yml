name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: berean-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: berean-mcp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:phase4
      - run: npm run data:validate
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('../docs/agent-resource-manifest.json','utf8'))"
